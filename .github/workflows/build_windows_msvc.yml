name: Build Windows MSVC

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Windows MSVC (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]
        include:
          - platform: Win32
            cmake_arch: Win32
          - platform: x64
            cmake_arch: x64

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A ${{ matrix.cmake_arch }} `
            -Ddont_use_uploadtoblob:BOOL=ON `
            -Duse_prov_client:BOOL=OFF `
            -Drun_e2e_tests:BOOL=OFF `
            -Drun_unittests:BOOL=OFF `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -- /m
